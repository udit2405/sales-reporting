<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Sales Report</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#d9dde3;--acc:#1b4fd8;--ok:#117a3d;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eceff3;--mute:#98a1ae;--line:#2c313a;--acc:#6b93ff;--ok:#4cc37f;--err:#ff7a70}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
label{display:block;font-size:14px;margin:10px 0 4px}
input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:0}
.code{font-size:13px;color:var(--mute);margin-top:6px;min-height:18px}
button{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
#msg{margin-top:12px;font-weight:600;text-align:center}
.ok{color:var(--ok)}.err{color:var(--err)}
</style></head><body><main>
<h1>Daily Sales Report</h1>
<form id="f" autocomplete="off">
<div class="card"><h2>Store</h2>
<label for="store">Select store name</label>
<input id="store" list="stores" placeholder="Type or pick a store" required>
<datalist id="stores"></datalist>
<div class="code" id="code"></div></div>

<div class="card"><h2>VIP</h2>
<label>VIP Sale</label><input data-f="VIP Sale" type="number" inputmode="decimal" step="any" min="0">
<label>SKY Sale</label><input data-f="SKY Sale" type="number" inputmode="decimal" step="any" min="0">
<label>ARI Sale</label><input data-f="ARI Sale" type="number" inputmode="decimal" step="any" min="0">
<label>VIP Total Sale</label><input data-f="VIP Total Sale" type="number" inputmode="decimal" step="any" min="0">
<label>VIP MTD Sale</label><input data-f="VIP MTD Sale" type="number" inputmode="decimal" step="any" min="0"></div>

<div class="card"><h2>AT / KT</h2>
<label>AT</label><input data-f="AT" type="number" inputmode="decimal" step="any" min="0">
<label>KT</label><input data-f="KT" type="number" inputmode="decimal" step="any" min="0">
<label>AT Total Sale</label><input data-f="AT TOTAL SALE" type="number" inputmode="decimal" step="any" min="0">
<label>AT MTD</label><input data-f="AT MTD" type="number" inputmode="decimal" step="any" min="0"></div>

<div class="card"><h2>Safari</h2>
<label>Safari Sale</label><input data-f="SAFARI SALE" type="number" inputmode="decimal" step="any" min="0">
<label>Safari MTD</label><input data-f="SAFARI MTD" type="number" inputmode="decimal" step="any" min="0"></div>

<button id="go" type="submit">Submit</button>
<div id="msg"></div>
</form>

const $ = id => document.getElementById(id);
function fill(){ $('stores').innerHTML = STORES.map(s=>`<option value="${s.name.replace(/"/g,'&quot;')}">`).join(''); }
fill();
// refresh store list live from the sheet (falls back to the built-in list)
(async()=>{try{
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`);
  const j = JSON.parse((await r.text()).replace(/^[^{]*/,'').replace(/\);?\s*$/,''));
  const live = j.table.rows.map(x=>({code:String(x.c[0]&&x.c[0].v||'').trim(),name:String(x.c[1]&&x.c[1].v||'').trim()})).filter(s=>s.code&&s.name);
  if(live.length){STORES=live;fill();}
}catch(e){}})();
const find = () => STORES.find(s=>s.name.toLowerCase()===$('store').value.trim().toLowerCase());
$('store').addEventListener('input',()=>{const s=find();$('code').textContent=s?'SAP code: '+s.code:'';});
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=$('msg'), s=find();
  if(!s){m.className='err';m.textContent='Please pick a store from the list.';return;}
  if(!SCRIPT_URL){m.className='err';m.textContent='Setup pending: SCRIPT_URL is not configured.';return;}
  const values={};document.querySelectorAll('[data-f]').forEach(i=>values[i.dataset.f]=i.value);
  $('go').disabled=true;m.className='';m.textContent='Submitting…';
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code:s.code,values})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Failed');
    m.className='ok';m.textContent='Submitted for '+s.name;
    $('f').reset();$('code').textContent='';
  }catch(err){m.className='err';m.textContent='Could not submit: '+err.message;}
  $('go').disabled=false;
});
</script></main></body></html>
